name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/sablelimits-1.0.0.jar#sablelimits-1.0.0.jar" \
            --title "SableLimits 1.0.0" \
            --notes "Server-side block limits and forbidden-block rules for Sable / Create: Aeronautics and Create Contraptions."
